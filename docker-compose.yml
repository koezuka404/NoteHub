services:
  postgres:
    image: postgres:15
    container_name: notehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: notehub
      POSTGRES_PASSWORD: notehub
      POSTGRES_DB: notehub
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notehub -d notehub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: notehub-redis
    restart: unless-stopped
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: notehub-backend
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      APP_ENV: development
      JWT_ISSUER: notehub-api
      JWT_AUDIENCE: notehub-client
      ACCESS_TOKEN_TTL_MINUTES: 15
      REFRESH_TOKEN_TTL_MINUTES: 30
      REFRESH_TOKEN_TTL_DAYS: 14
      BCRYPT_COST: 12
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: Lax
      COOKIE_DOMAIN: ""
      REFRESH_TOKEN_COOKIE_NAME: notehub_refresh_token
      CSRF_TOKEN_COOKIE_NAME: notehub_csrf_token
      DATABASE_URL: postgres://notehub:notehub@postgres:5432/notehub?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      HTTP_PORT: 8080
      PUBLIC_HTTP_URL: http://localhost:8081
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: notehub-frontend
    restart: unless-stopped
    tty: true
    environment:
      VITE_PROXY_TARGET: http://backend:8080
      VITE_WS_BASE_URL: ws://localhost:8081
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
