services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: notehub
      POSTGRES_PASSWORD: notehub
      POSTGRES_DB: notehub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notehub -d notehub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      APP_ENV: production
      JWT_ISSUER: notehub-api
      JWT_AUDIENCE: notehub-client
      BCRYPT_COST: 12
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: None
      DATABASE_URL: postgres://notehub:notehub@postgres:5432/notehub?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      HTTP_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    restart: unless-stopped
    environment:
      VITE_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
