      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [Account]
      summary: アカウント論理削除（ホストのみ）
      operationId: deleteAccount
      description: 仕様書では `/delete` パスだが、実装は `/delete-account`。
      security:
        - bearerAuth: []
      responses:
