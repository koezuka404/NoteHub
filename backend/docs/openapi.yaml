      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/VersionId"
    get:
      tags: [Version]
      summary: 編集履歴詳細
      operationId: getVersion
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
