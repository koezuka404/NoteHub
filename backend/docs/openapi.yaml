openapi: 3.0.3
info:
  title: NoteHub API
  version: "0.1.0"
  description: |
    NoteHub REST API および WebSocket 仕様。

    - Access Token: `Authorization: Bearer <token>` ヘッダー（15分有効）
    - Refresh Token: HttpOnly Cookie `notehub_refresh_token`（`/api/auth` パス）
    - CSRF: `GET /api/auth/csrf` で事前取得したトークンを `Sec-Fetch-Site` 検証と併用。`register` / `login` / `logout` は Double Submit 必須（Echo v4.15 方式）

    成功時は `{ "data": ... }`、失敗時は `{ "error": { "code", "message", "requestId?" } }`。

servers:
  - url: http://localhost:8080
    description: Local development
  - url: http://localhost:8082
    description: Local integration test

tags:
  - name: Health
  - name: Auth
  - name: Workspace
  - name: Member
  - name: Account
  - name: Document
  - name: Version
  - name: WebSocket

paths:
  /health:
    get:
      tags: [Health]
      summary: ヘルスチェック
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /api/auth/csrf:
    get:
      tags: [Auth]
      summary: CSRF トークン取得
      operationId: issueCsrf
      description: |
        ログイン前の register / login 用 CSRF トークンを発行する。
        成功時、`notehub_csrf_token` Cookie を Set-Cookie する。
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              description: CSRF Cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CSRFResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/auth/register:
    post:
      tags: [Auth]
      summary: ユーザー登録
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/auth/login:
    post:
      tags: [Auth]
      summary: ログイン
      operationId: login
      description: |
        成功時、`notehub_refresh_token` と `notehub_csrf_token` Cookie を Set-Cookie する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              description: Refresh / CSRF Cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Access Token 再発行
      operationId: refresh
      description: Refresh Token Cookie と CSRF Header が必要。
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RefreshResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: ログアウト
      operationId: logout
      security:
        - bearerAuth: []
        - csrfHeader: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LogoutResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/me:
    get:
      tags: [Auth]
      summary: 現在のユーザー取得
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

