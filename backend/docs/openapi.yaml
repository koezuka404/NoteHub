  /ws/documents/{documentId}:
    get:
      tags: [WebSocket]
      summary: ドキュメント共同編集 WebSocket
      operationId: connectDocumentWebSocket
      description: |
        HTTP GET で WebSocket にアップグレードする。

        **認証**: クエリ `access_token` または `Authorization: Bearer` ヘッダー。

        **サーバー → クライアント** (`{ type, data, timestamp }`):
        - `connected` — 接続確立
        - `document_sync` — 初期本文同期
        - `document_updated` — 本文/タイトル更新（`content`, `title` は optional）
        - `editors_sync`, `editor_joined`, `editor_left` — 編集者一覧
        - `document_restored` — バージョン復元
        - `document_deleted`, `workspace_deleted`, `account_suspended`, `account_deleted`,
          `workspace_host_suspended`, `workspace_host_deleted`, `member_removed` — 終端イベント
        - `error` — エラー

        **クライアント → サーバー**:
        - `document_edit` — `{ "data": { "content": "..." } }`
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - name: access_token
          in: query
          required: false
          schema:
            type: string
      responses:
        "101":
          description: Switching Protocols（WebSocket）
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: WebSocket 接続数上限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ws/workspaces/{workspaceId}:
    get:
      tags: [WebSocket]
      summary: ワークスペース一覧 WebSocket
      operationId: connectWorkspaceWebSocket
      description: |
        ドキュメント一覧ページ向け。メンバーがワークスペース内のドキュメント変更を受信する。

        **サーバー → クライアント**:
        - `connected`
        - `document_created` — 新規ドキュメント
        - `document_updated` — タイトル更新（一覧向け）
        - `document_deleted` — 削除
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: access_token
          in: query
          required: false
          schema:
            type: string
      responses:
        "101":
          description: Switching Protocols（WebSocket）
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access Token（15分有効、メモリ保持）
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF Cookie `notehub_csrf_token` と同値

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Too Many Requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Service Unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    WorkspaceForbidden:
      description: Workspace access or permission denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ApiResponse:
      type: object
      required: [data]
      properties:
        data: {}

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: 入力値が不正です
            requestId:
              type: string
              format: uuid

    AuthUser:
      type: object
      required: [id, name, email, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum: [active, suspended, deleted]

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 15
          description: 英字と数字を含む

    RegisterResponse:
      type: object
      required: [user, createdAt]
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        createdAt:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      required: [user, accessToken, tokenType, expiresAt]
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresAt:
          type: string
          format: date-time

    RefreshResponse:
      type: object
      required: [accessToken, tokenType, expiresAt]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresAt:
          type: string
          format: date-time

    CSRFResponse:
      type: object
      required: [csrfToken]
      properties:
        csrfToken:
          type: string

    LogoutResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    MeResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"

    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100

    CreateWorkspaceResponse:
      type: object
      required: [id, name, hostId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        hostId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    WorkspaceListItem:
